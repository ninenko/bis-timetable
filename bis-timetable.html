<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BIS Timetable</title>
<style>
:root{
  --bg:#f7f7f5; --panel:#fff; --ink:#1c1c1a; --muted:#6b6b63; --line:#e3e2dd;
  --accent:#2f6f5e; --accent-soft:#e6f0ec; --warn:#8a5a00; --warn-soft:#fdf1d8;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 8px 24px rgba(0,0,0,.05);
  --radius:10px; --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#16171a; --panel:#1e2024; --ink:#e8e8e4; --muted:#9a9a92; --line:#2e3136;
  --accent:#6fbfa4; --accent-soft:#1d2f2a; --warn:#e0b356; --warn-soft:#3a2f16;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.3);
}}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
.wrap{max-width:1400px;margin:0 auto;padding:0 16px 64px}

/* ---------- header ---------- */
header{position:sticky;top:0;z-index:40;background:var(--bg);border-bottom:1px solid var(--line)}
.hdr{max-width:1400px;margin:0 auto;padding:10px 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.brand{font-weight:650;letter-spacing:-.01em;font-size:17px;white-space:nowrap;cursor:pointer}
.brand span{color:var(--muted);font-weight:400}
.grow{flex:1 1 220px;min-width:180px;position:relative}
.stamp{font-size:12px;color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:6px}
.stamp.stale{color:var(--warn);background:var(--warn-soft);padding:4px 8px;border-radius:999px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--accent);display:inline-block}
.stamp.stale .dot{background:var(--warn)}
.gear{border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:8px;
      padding:5px 9px;cursor:pointer;font-size:13px}
.gear:hover{color:var(--ink)}

/* ---------- search ---------- */
.searchbox{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:8px;
  background:var(--panel);color:var(--ink);font:15px var(--sans);box-shadow:var(--shadow)}
.searchbox:focus{outline:2px solid var(--accent);outline-offset:-1px}
.results{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--panel);
  border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);
  max-height:min(60vh,420px);overflow:auto;z-index:60;display:none}
.results.open{display:block}
.res-group{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);
  padding:8px 12px 4px;position:sticky;top:0;background:var(--panel)}
.res{padding:7px 12px;cursor:pointer;display:flex;justify-content:space-between;gap:10px}
.res:hover,.res.sel{background:var(--accent-soft)}
.res small{color:var(--muted)}

/* ---------- tabs ---------- */
nav.tabs{display:flex;gap:4px;margin:16px 0 12px;flex-wrap:wrap}
.tab{padding:6px 12px;border-radius:999px;border:1px solid transparent;cursor:pointer;
  font-size:14px;color:var(--muted)}
.tab:hover{color:var(--ink)}
.tab.on{background:var(--panel);border-color:var(--line);color:var(--ink);font-weight:550;box-shadow:var(--shadow)}

/* ---------- generic panel ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:16px;margin-bottom:16px}
h1{font-size:22px;margin:0 0 2px;letter-spacing:-.01em}
h2{font-size:15px;margin:0 0 10px;font-weight:600}
.sub{color:var(--muted);font-size:13px;margin:0 0 14px}
.muted{color:var(--muted)}

/* ---------- grid ---------- */
.gridwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.tt{border-collapse:separate;border-spacing:0;width:100%;min-width:900px}
table.tt th,table.tt td{border-bottom:1px solid var(--line);vertical-align:top;padding:0}
table.tt thead th{background:var(--bg);
  font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);
  font-weight:600;padding:8px 10px;text-align:left;border-bottom:1px solid var(--line)}
.pcell{width:104px;min-width:104px;padding:10px 10px 10px 2px;white-space:nowrap}
.pnum{font-weight:600;font-size:13px;white-space:normal}
.ptime{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
tr.brk td{background:transparent;padding:2px 0}
tr.brk .pcell{color:var(--muted);font-size:11px;padding:4px 10px 4px 2px}
td.slot{padding:4px 5px 4px 0;width:19%}
.ev{border-radius:8px;padding:6px 8px;margin-bottom:4px;border-left:3px solid var(--evc,var(--accent));
  background:var(--evbg,var(--accent-soft))}
.ev .s{font-weight:600;font-size:13px;line-height:1.25}
.ev .m{font-size:12px;color:var(--muted);margin-top:2px;display:flex;flex-wrap:wrap;gap:4px 6px}
.chip{cursor:pointer;border-bottom:1px dotted currentColor}
.chip:hover{color:var(--ink)}
.ev .t{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.free{color:var(--muted);font-size:12px;padding:6px 2px;opacity:.45}

/* ---------- pickers / lists ---------- */
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.pill{background:var(--accent-soft);color:var(--ink);border:1px solid var(--line);
  border-radius:999px;padding:4px 10px;font-size:13px;display:flex;gap:6px;align-items:center}
.pill b{font-weight:600}
.pill .x{cursor:pointer;color:var(--muted)}
.pill .x:hover{color:var(--ink)}
.matrix{border-collapse:separate;border-spacing:2px;width:100%;min-width:640px}
.matrix th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);
  font-weight:600;text-align:left;padding:4px 6px}
.matrix td{padding:8px 6px;border-radius:6px;font-size:12px;text-align:center;background:var(--bg)}
.matrix td.ok{background:var(--accent-soft);color:var(--accent);font-weight:600;cursor:pointer}
.matrix td.busy{color:var(--muted);opacity:.55}
.matrix td.brk{background:transparent;opacity:.3}
.matrix th.rowh{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;width:150px}
.matrix{table-layout:fixed}
.roomlist{display:flex;flex-wrap:wrap;gap:6px}
.room{padding:5px 10px;border:1px solid var(--line);border-radius:8px;font-size:13px;cursor:pointer;background:var(--bg)}
.room:hover{background:var(--accent-soft)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
select,input[type=text],input[type=password]{padding:7px 10px;border:1px solid var(--line);
  border-radius:8px;background:var(--panel);color:var(--ink);font:14px var(--sans)}
button.btn{padding:7px 14px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);
  color:#fff;font:14px var(--sans);cursor:pointer}
button.btn.ghost{background:transparent;color:var(--accent)}
button.btn:disabled{opacity:.5;cursor:default}
label.lbl{font-size:12px;color:var(--muted);display:block;margin-bottom:3px}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;z-index:100;
  align-items:flex-start;justify-content:center;padding:60px 16px}
.modal.open{display:flex}
.modal .card{max-width:520px;width:100%;margin:0}
.note{font-size:12px;color:var(--muted);margin-top:6px}
.status{font-size:13px;margin-top:10px}
.status.ok{color:var(--accent)}
.status.err{color:#c0392b}
kbd{font:11px var(--mono);background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:1px 5px}
.footer{color:var(--muted);font-size:12px;text-align:center;padding:8px 0 0}
</style><style>
/* ---- additions for the tabbed layout ---- */
.filterline{position:relative;margin-bottom:12px}
.filterline input{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:8px;
  background:var(--panel);color:var(--ink);font:15px var(--sans)}
.filterline input:focus{outline:2px solid var(--accent);outline-offset:-1px}
.hint{font-size:12px;color:var(--muted);margin-top:6px}
.room.on{background:var(--accent);border-color:var(--accent);color:#fff}
.room.first{box-shadow:0 0 0 2px var(--accent-soft) inset}
.count{font-size:12px;color:var(--muted);margin:0 0 8px}
.about{border-top:1px solid var(--line);margin-top:40px;padding-top:14px}
.about summary{cursor:pointer;font-size:14px;font-weight:600;letter-spacing:.02em;
  list-style:none;padding:6px 0;color:var(--muted);display:flex;align-items:center;gap:7px}
.about summary::-webkit-details-marker{display:none}
.about summary:hover{color:var(--ink)}
.about summary::before{content:"\25B8";font-size:11px;transition:transform .15s}
.about details[open] summary::before{transform:rotate(90deg)}
.about details[open] summary{color:var(--ink);margin-bottom:12px}
.about .byline{font-size:12px;color:var(--muted);padding:2px 0 4px}
.about p{font-size:13px;color:var(--muted);max-width:62ch;margin:0 0 10px}
.about .cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:22px}
.about code{font:12px var(--mono);background:var(--panel);border:1px solid var(--line);
  border-radius:4px;padding:1px 5px}
.about table{border-collapse:collapse;font-size:13px}
.about td{padding:2px 14px 2px 0}
.about td.n{font-weight:600;color:var(--ink)}
.viewhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
</style>
</head>

let DATA = null, IDX = null;
const STALE_DAYS = 7;

const KIND = {
  grade:   {tab:"#/grades",   list:"grades",   label:"Grade",   plural:"Grades",   ph:"Type a grade — 9, 6B, Preschool…"},
  teacher: {tab:"#/teachers", list:"teachers", label:"Teacher", plural:"Teachers", ph:"Type a name — Kakenov, Makiko, Alex…"},
  room:    {tab:"#/rooms",    list:"rooms",    label:"Room",    plural:"Rooms",    ph:"Type a room — CAC1, Lab, E-Centre…"}
};

function boot(){
  try{
    DATA = EMBEDDED;
    buildIndex();
    stamp();
    renderAbout();
    window.addEventListener("hashchange", route);
    route();
  }catch(e){
    document.getElementById("view").innerHTML =
      '<div class="card"><h1>Could not read the timetable</h1><p class="sub">'+esc(e.message)+'</p></div>';
  }
}

function buildIndex(){
  IDX = {teacher:new Map(), grade:new Map(), room:new Map()};
  const push=(m,k,e)=>{ if(!k) return; if(!m.has(k)) m.set(k,[]); m.get(k).push(e); };
  DATA.events.forEach(e=>{
    (e.teachers||[]).forEach(t=>push(IDX.teacher,t,e));
    push(IDX.grade, e.grade, e);
    push(IDX.room, e.room, e);
  });
  ["teacher","grade","room"].forEach(k=>
    DATA.meta[KIND[k].list].forEach(n=>{ if(!IDX[k].has(n)) IDX[k].set(n,[]); }));
}

const esc = s => String(s==null?"":s).replace(/[&<>"']/g,
  c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const q = s => JSON.stringify(String(s)).replace(/"/g,"&quot;");
const fmtDate = d => d.toLocaleString(undefined,
  {day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});

function stamp(){
  const el = document.getElementById("stamp");
  const d = new Date(DATA.fetched_at);
  const age = (Date.now()-d.getTime())/864e5;
  const t = DATA.term || {};
  const term = t.schoolyear ? (t.schoolyear+" · term "+t.term) : ("t="+DATA.source.t);
  el.className = "stamp" + (age>STALE_DAYS ? " stale":"");
  el.innerHTML = '<span class="dot"></span>'+esc(term)+' · data as of '+fmtDate(d)+
    (age>STALE_DAYS ? " — "+Math.floor(age)+" days old" : "");
  el.title = "Scraped from bis.kg at "+d.toString();
}

/* ============================ routing ============================ */
function route(){
  const h = decodeURIComponent(location.hash.replace(/^#\/?/,""));
  const parts = h.split("/").filter(x=>x!=="");
  const head = parts[0] || "teachers";
  const tabFor = {grades:"#/grades", teachers:"#/teachers", rooms:"#/rooms",
                  grade:"#/grades", teacher:"#/teachers", room:"#/rooms",
                  free:"#/free", empty:"#/empty"}[head] || "#/teachers";
  document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("on", t.dataset.go===tabFor));
  window.scrollTo({top:0});
  switch(head){
    case "grades":   return picker("grade", null);
    case "teachers": return picker("teacher", null);
    case "rooms":    return picker("room", null);
    case "grade":    return picker("grade", parts.slice(1).join("/"));
    case "teacher":  return picker("teacher", parts.slice(1).join("/"));
    case "room":     return picker("room", parts.slice(1).join("/"));
    case "free":     return renderFree(parts[1] ? parts[1].split("+") : []);
    case "empty":    return renderEmpty(parts[1], parts[2]);
    default:         return picker("teacher", null);
  }
}
const go = (kind,name) => { location.hash = "#/"+kind+"/"+encodeURIComponent(name); };
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{ location.hash = t.dataset.go; });

/* ============================ picker tabs ============================ */
/* One shape for Grades / Teachers / Rooms: a line you type into, the matching
   options underneath it, and the selected week below that. The options stay on
   screen after you pick one, so switching is one click, not a back-and-retype. */

let filterText = "";

function matches(kind, term){
  // meta order, not index order: teachers and rooms come sorted, grades come in
  // the order the school publishes them (Preschool -> G12 -> Staff)
  const names = DATA.meta[KIND[kind].list].filter(Boolean);
  term = term.trim().toLowerCase();
  if(!term) return names;
  const scored = [];
  names.forEach(n=>{
    const l = n.toLowerCase(), i = l.indexOf(term);
    if(i < 0) return;
    scored.push({n, rank: i===0 ? 0 : (/[\s-]/.test(l[i-1]) ? 1 : 2)});
  });
  scored.sort((a,b)=>a.rank-b.rank || a.n.localeCompare(b.n));
  return scored.map(x=>x.n);
}

function optionsHtml(kind, name){
  const list = matches(kind, filterText);
  return list.map((n,i)=>'<div class="room'+(n===name?" on":"")+
      ((i===0 && filterText) ? " first":"")+'" onclick="go(\'' + kind + '\',' + q(n) + ')">'+
      esc(n)+'</div>').join("")
    || '<span class="muted">nothing matches &mdash; try fewer letters</span>';
}

function countHtml(kind){
  const n = matches(kind, filterText).length;
  return n + " of " + IDX[kind].size + " " + KIND[kind].plural.toLowerCase() +
    (filterText ? " matching “" + esc(filterText) + "”" : "") +
    " &middot; click one, or press Enter for the first";
}

function picker(kind, name){
  const K = KIND[kind];
  if(name && !IDX[kind].has(name)) name = null;
  document.getElementById("view").innerHTML =
    '<div class="card">' +
      '<div class="filterline">' +
        '<input id="filt" autocomplete="off" spellcheck="false" placeholder="' + esc(K.ph) +
        '" value="' + esc(filterText) + '">' +
      '</div>' +
      '<p class="count" id="cnt">' + countHtml(kind) + '</p>' +
      '<div class="roomlist" id="opts">' + optionsHtml(kind, name) + '</div>' +
    '</div>' +
    '<div id="grid"></div>';

  const inp = document.getElementById("filt");
  inp.oninput = function(){ filterText = inp.value; redrawOptions(kind, name); };
  inp.onkeydown = function(e){
    if(e.key === "Enter"){
      const first = matches(kind, filterText)[0];
      if(first) go(kind, first);
    }
    if(e.key === "Escape"){ filterText = ""; inp.value = ""; redrawOptions(kind, name); }
  };
  if(!name) inp.focus();
  if(name) renderEntity(kind, name);
}

function redrawOptions(kind, name){
  document.getElementById("cnt").innerHTML = countHtml(kind);
  document.getElementById("opts").innerHTML = optionsHtml(kind, name);
}

function renderEntity(kind, name){
  const list = IDX[kind].get(name) || [];
  const K = KIND[kind];
  const slots = new Set(list.map(e=>e.day+"|"+e.period+"|"+(e.start||"")));
  const rooms = [...new Set(list.map(e=>e.room).filter(Boolean))];
  const teaching = new Set(list.filter(e=>e.period<=9).map(e=>e.day+"|"+e.period)).size;
  const capacity = DAYS.length * DATA.meta.periods.filter(p=>p.period && p.period<=9).length;

  let side = slots.size + " lesson" + (slots.size===1?"":"s") + " a week";
  if(kind==="teacher") side += " · " + rooms.length + " room" + (rooms.length===1?"":"s");
  if(kind==="room")    side += " · " + Math.round(100*teaching/capacity) + "% of P1–P9 used";

  document.getElementById("grid").innerHTML =
    '<div class="card"><div class="viewhead">' +
      '<div><h1>' + esc(name) + '</h1><p class="sub" style="margin:0">' +
        K.label + ' · ' + side + '</p></div>' +
      '<button class="btn ghost" onclick="location.hash=\'#/free/\'+encodeURIComponent(' + q(name) +
        ')">Find a slot with…</button>' +
    '</div></div>' +
    '<div class="card"><div class="gridwrap">' + weekGrid(list, kind) + '</div></div>';
}

/* ============================ the week grid ============================ */
function weekGrid(list, hideKind){
  const byKey = {};
  list.forEach(e=>{
    const k = e.day+"|"+(e.period==null?"?":e.period);
    (byKey[k] = byKey[k]||[]).push(e);
  });
  let html = '<table class="tt"><thead><tr><th class="pcell">Period</th>' +
    DAYS.map(d=>'<th>'+d+'</th>').join("") + '</tr></thead><tbody>';
  DATA.meta.periods.forEach(p=>{
    if(p.break){
      html += '<tr class="brk"><td class="pcell">'+esc(p.start)+'</td>'+
              '<td colspan="5" class="free" style="padding-left:0">break</td></tr>';
      return;
    }
    html += '<tr><td class="pcell"><div class="pnum">'+esc(p.label)+
            '</div><div class="ptime">'+p.start+'–'+p.end+'</div></td>';
    DAYS.forEach(d=>{
      const evs = mergeCell(byKey[d+"|"+p.period] || []);
      html += '<td class="slot">' +
        (evs.length ? evs.map(e=>evCard(e,hideKind)).join("") : '<div class="free">—</div>') +
        '</td>';
    });
    html += '</tr>';
  });
  return html + '</tbody></table>';
}

/* One lesson taught to several grades at once arrives as one event per grade.
   Collapse those into a single card so a cell shows the lesson, not three copies
   of it. Option blocks have different subjects and stay separate. */
function mergeCell(evs){
  const out = new Map();
  evs.forEach(e=>{
    const k = [e.subject,e.room,e.start,(e.teachers||[]).join("|")].join("  ");
    if(!out.has(k)) out.set(k, Object.assign({}, e, {grades: []}));
    const m = out.get(k);
    if(e.grade && !m.grades.includes(e.grade)) m.grades.push(e.grade);
  });
  return [...out.values()].sort((a,b)=>
    (a.start||"").localeCompare(b.start||"") ||
    String(a.subject).localeCompare(String(b.subject)));
}

function hue(s){ let h=0; for(let i=0;i<(s||"").length;i++) h=(h*31+s.charCodeAt(i))%360; return h; }
function evStyle(e){
  const h = hue(e.subject||"");
  const dark = matchMedia("(prefers-color-scheme:dark)").matches;
  return "--evc:hsl("+h+",42%,"+(dark?"58%":"42%")+");--evbg:hsl("+h+","+(dark?"24%,14%":"56%,95%")+")";
}
const chip = (kind,name) => !name ? "" :
  '<span class="chip" onclick="go(\''+kind+'\','+q(name)+')">'+esc(name)+'</span>';

function evCard(e, hideKind){
  const bits = [];
  if(hideKind!=="teacher") (e.teachers||[]).forEach(t=>bits.push(chip("teacher",t)));
  if(hideKind!=="grade") (e.grades||[e.grade]).filter(Boolean).forEach(g=>bits.push(chip("grade",g)));
  if(hideKind!=="room" && e.room) bits.push(chip("room",e.room));
  const timed = e.timed ? '<div class="t">'+esc(e.start)+'–'+esc(e.end)+'</div>' : "";
  return '<div class="ev" style="'+evStyle(e)+'">'+
         '<div class="s">'+esc(e.subject||"(no subject)")+'</div>'+timed+
         (bits.length?'<div class="m">'+bits.join("")+'</div>':"")+'</div>';
}

/* ============================ find a slot ============================ */
/* Add any mix of teachers, grades and rooms; green means every one of them has
   nothing timetabled in that slot. */

let slotFilter = "";

function kindOf(n){
  return IDX.teacher.has(n) ? "teacher" : (IDX.grade.has(n) ? "grade" : (IDX.room.has(n) ? "room" : null));
}

function slotMatches(term){
  term = term.trim().toLowerCase();
  if(!term) return [];
  const hits = [];
  ["teacher","grade","room"].forEach(k=>{
    DATA.meta[KIND[k].list].filter(Boolean).forEach(n=>{
      const l = n.toLowerCase(), i = l.indexOf(term);
      if(i < 0) return;
      hits.push({n, k, rank: i===0 ? 0 : (/[\s-]/.test(l[i-1]) ? 1 : 2)});
    });
  });
  hits.sort((a,b)=>a.rank-b.rank || a.n.localeCompare(b.n));
  return hits.slice(0, 30);
}

function renderFree(names){
  names = names.filter(n=>kindOf(n));
  window.__slot = names;

  const busy = {};
  names.forEach(n=>{ busy[n] = new Set((IDX[kindOf(n)].get(n)||[]).map(e=>e.day+"|"+e.period)); });
  const periods = DATA.meta.periods.filter(p=>!p.break);

  let matrix = "";
  if(names.length){
    matrix = '<div class="gridwrap"><table class="matrix"><tr><th></th>' +
      DAYS.map(d=>'<th>'+d.slice(0,3)+'</th>').join("") + '</tr>';
    periods.forEach(p=>{
      matrix += '<tr><th class="rowh">'+esc(p.label)+' <span class="muted">'+p.start+'</span></th>';
      DAYS.forEach(d=>{
        const k = d+"|"+p.period;
        const blocked = names.filter(n=>busy[n].has(k));
        if(!blocked.length){
          matrix += '<td class="ok" title="all free">free</td>';
        }else{
          const who = blocked.map(n=>n.split(" ")[0]).join(", ");
          matrix += '<td class="busy" title="'+esc(blocked.join(", "))+' busy">'+
            (blocked.length===names.length ? "—" : esc(who))+'</td>';
        }
      });
      matrix += '</tr>';
    });
    matrix += '</table></div>';
  }

  document.getElementById("view").innerHTML =
    '<div class="card">' +
      '<h1>Find a slot</h1>' +
      '<p class="sub">Add two or more people &mdash; or grades, or rooms. Green means every one ' +
        'of them has nothing timetabled then.</p>' +
      '<div class="pills">' + (names.map(n=>
        '<span class="pill"><b>'+esc(n)+'</b><span class="x" onclick="dropSlot('+q(n)+')">×</span></span>'
      ).join("") || '<span class="muted">nobody added yet</span>') + '</div>' +
      '<div class="filterline">' +
        '<input id="slotq" autocomplete="off" spellcheck="false" ' +
          'placeholder="Type a name, grade or room, then Enter to add">' +
        '<div id="slotres" class="results"></div>' +
      '</div>' +
      (names.length ? '<button class="btn ghost" onclick="location.hash=\'#/free\'">Clear all</button>' : '') +
      (names.length===1 ? '<p class="hint">One on its own just shows their gaps &mdash; add another to compare.</p>' : '') +
    '</div>' +
    (matrix ? '<div class="card">'+matrix+'</div>' : '');

  const inp = document.getElementById("slotq");
  const box = document.getElementById("slotres");
  const draw = ()=>{
    const hits = slotMatches(slotFilter).filter(h=>!names.includes(h.n));
    if(!hits.length){ box.className = "results"; box.innerHTML = ""; return; }
    let html = "", last = "";
    hits.forEach((h,i)=>{
      if(h.k !== last){ html += '<div class="res-group">'+KIND[h.k].plural+'</div>'; last = h.k; }
      html += '<div class="res'+(i===0?" sel":"")+'" onclick="addSlot('+q(h.n)+')">'+
              '<span>'+esc(h.n)+'</span><small>'+IDX[h.k].get(h.n).length+' lessons</small></div>';
    });
    box.innerHTML = html; box.className = "results open";
  };
  inp.oninput = ()=>{ slotFilter = inp.value; draw(); };
  inp.onkeydown = e=>{
    if(e.key === "Enter"){
      const first = slotMatches(slotFilter).filter(h=>!names.includes(h.n))[0];
      if(first) addSlot(first.n);
    }
    if(e.key === "Escape"){ slotFilter = ""; inp.value = ""; draw(); }
  };
  inp.focus();
}

function addSlot(n){
  const cur = (window.__slot || []).slice();
  if(!cur.includes(n)) cur.push(n);
  slotFilter = "";
  location.hash = "#/free/" + cur.map(encodeURIComponent).join("+");
}
function dropSlot(n){
  const cur = (window.__slot || []).filter(x=>x!==n);
  location.hash = cur.length ? "#/free/"+cur.map(encodeURIComponent).join("+") : "#/free";
}

/* ============================ empty rooms ============================ */
function renderEmpty(day, period){
  day = DAYS.includes(day) ? day : DAYS[Math.min(4, Math.max(0, new Date().getDay()-1))];
  const periods = DATA.meta.periods.filter(p=>!p.break);
  period = (period != null && periods.some(p=>String(p.period)===String(period)))
           ? String(period) : String(periods[0].period);

  const used = new Map();
  DATA.events.forEach(e=>{
    if(e.day===day && String(e.period)===period && e.room){
      if(!used.has(e.room)) used.set(e.room, []);
      used.get(e.room).push(e);
    }
  });
  const free = DATA.meta.rooms.filter(r=>!used.has(r));
  const taken = DATA.meta.rooms.filter(r=>used.has(r));
  const p = periods.find(x=>String(x.period)===period);

  document.getElementById("view").innerHTML =
    '<div class="card">' +
      '<h1>Empty rooms</h1>' +
      '<p class="sub">Rooms with nothing timetabled in the chosen slot.</p>' +
      '<div class="row">' +
        '<div><label class="lbl">Day</label><select id="rDay" onchange="emptyGo()">' +
          DAYS.map(d=>'<option'+(d===day?" selected":"")+'>'+d+'</option>').join("") +
        '</select></div>' +
        '<div><label class="lbl">Period</label><select id="rPer" onchange="emptyGo()">' +
          periods.map(x=>'<option value="'+x.period+'"'+(String(x.period)===period?" selected":"")+'>'+
            esc(x.label)+' · '+x.start+'–'+x.end+'</option>').join("") +
        '</select></div>' +
      '</div>' +
      '<h2 style="margin-top:8px">'+free.length+' free · '+day+' '+esc(p.label)+
        ' ('+p.start+'–'+p.end+')</h2>' +
      '<div class="roomlist">' + (free.map(r=>
        '<div class="room" onclick="go(\'room\','+q(r)+')">'+esc(r)+'</div>').join("")
        || '<span class="muted">none</span>') + '</div>' +
    '</div>' +
    '<div class="card"><h2>In use ('+taken.length+')</h2><div class="roomlist">' +
      taken.map(r=>{
        const e = used.get(r)[0];
        return '<div class="room" title="'+esc((e.subject||"")+" · "+(e.teachers||[]).join(", "))+
               '" onclick="go(\'room\','+q(r)+')">'+esc(r)+
               ' <span class="muted">'+esc(e.grade||e.subject||"")+'</span></div>';
      }).join("") + '</div></div>';
}
function emptyGo(){
  location.hash = "#/empty/" + encodeURIComponent(document.getElementById("rDay").value) +
                  "/" + document.getElementById("rPer").value;
}

/* ============================ the footer ============================ */
function renderAbout(){
  const r = DATA.report || {}, s = DATA.source || {}, m = DATA.meta;
  const link = v => '<a href="'+esc(s.url)+v+'" target="_blank" rel="noopener">view='+v+'</a>';
  const rows = [
    ["Lessons parsed", r.events],
    ["Confirmed in all three source views", r.in_all_three_views],
    ["Seen in only one view", r.single_view_only],
    ["Lessons with no teacher named", r.events_without_teacher],
    ["Cells the parser could not read", (r.unparsed_cells||[]).length]
  ];
  const amb = (r.unresolved_short_names||[]);

  document.getElementById("about").innerHTML =
    '<details>' +
    '<summary>About this page</summary>' +
    '<div class="cols">' +
      '<div>' +
        '<p><b>Where the data comes from.</b> The school publishes the same timetable three ways: ' +
          'by grade (' + link("sy") + '), by teacher (' + link("te") + ') and by room (' +
          link("cr") + '). Each one leaves something out — the grade view usually omits the ' +
          'teacher, the teacher view can’t show a lesson nobody is assigned to, the room view ' +
          'misses anything with no room. A script reads all three and reconciles them, so ' +
          'agreement between the views is the quality check.</p>' +
        '<p><b>Names.</b> Only the teacher view carries full names; the others use short forms ' +
          'like “Mr. Alex V”. Any lesson appearing in both pins the pair, and the rest are matched ' +
          'on first name plus surname initial. Anything still ambiguous is left exactly as written' +
          (amb.length ? ' — currently ' + amb.map(n=>'<code>'+esc(n)+'</code>').join(", ") : '') + '.</p>' +
      '</div>' +
      '<div>' +
        '<p><b>How current it is.</b> The timetable is baked into this file, so it shows the same ' +
          'week until the file is rebuilt.</p>' +
        '<p><b>What “free” means here.</b> No timetabled lesson. Duties, cover and anything not ' +
          'in the published timetable are invisible to this page.</p>' +
      '</div>' +
      '<div>' +
        '<table>' + rows.map(x=>
          '<tr><td>'+x[0]+'</td><td class="n">'+(x[1]==null?"–":x[1])+'</td></tr>').join("") +
          '<tr><td>Teachers / grades / rooms</td><td class="n">' +
          m.teachers.length+' / '+m.grades.length+' / '+m.rooms.length+'</td></tr>' +
        '</table>' +
        '<p style="margin-top:10px">Scraped ' + esc(DATA.fetched_at) + ' from <code>access=' +
          esc(s.access) + '&t=' + esc(s.t) + '</code>.</p>' +
      '</div>' +
    '</div>' +
    '<p class="byline">Created by Ivan Ninenko using Claude.</p>' +
    '</details>';
}

boot();
</script>
